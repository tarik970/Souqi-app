name: souqi
description: "Souqi — offline point-of-sale and invoice app for small shops."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # flutter_localizations pins the exact intl version; "any" defers to it.
  intl: any

  # Material widgets: package:flutter/material.dart is deprecated since
  # Flutter 3.47 in favor of this package.
  material_ui: ^1.11.0

  flutter_riverpod: ^3.0.0
  sqflite: ^2.4.2
  path: ^1.9.0
  path_provider: ^2.1.5
  # 10.x+ required: older versions apply the Kotlin Gradle Plugin, which
  # fails to build on Flutter 3.50 (Built-in Kotlin).
  package_info_plus: ^10.2.2

  cupertino_icons: ^1.0.8

  # Phase 3 (printing / sharing). Bluetooth and ESC/POS deliberately use NO
  # package: see android/.../PrinterConnection.kt and lib/core/printing/.
  # System share sheet (image / PDF).
  share_plus: ^13.3.1
  # Picking the shop logo (Android photo picker, no storage permission).
  image_picker: ^1.2.4
  # Pure Dart: wraps the rendered invoice image in a paper-width PDF page.
  pdf: ^3.13.1

  # Phase 4c (prepaid card codes).
  # The key that encrypts card codes lives in the Android Keystore.
  flutter_secure_storage: ^11.2.0
  # AES-256-GCM for the codes (pure Dart).
  cryptography: ^2.9.0
  # HMAC-SHA-256 for the code lookup hash, PBKDF2 for the PIN (synchronous).
  crypto: ^3.0.8
  # Scanning the QR code / barcode on a card. Uses the BUNDLED ML Kit model:
  # works offline and without Google Play services. Do not set
  # dev.steenbakker.mobile_scanner.useUnbundled in android/gradle.properties.
  mobile_scanner: ^7.5.0
  # Pure Dart: the module matrix of the optional QR code printed with a card.
  qr: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

  # Icon/splash generation (dev-time only; fetched from pub.dev, the Android
  # side builds through the Aliyun mirrors like everything else).
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  # Used by tool/make_brand_icons.dart to derive icon variants.
  image: ^4.5.4

flutter_launcher_icons:
  android: true
  ios: false
  # Legacy (pre-8.0) icon: the mark composed on cream by tool/make_brand_icons.dart.
  image_path: assets/branding/souqi_icon_legacy.png
  adaptive_icon_background: "#FAF6EC"
  adaptive_icon_foreground: assets/branding/souqi_icon_foreground.png
  # Android 13+ themed icon: white silhouette generated from the mark.
  adaptive_icon_monochrome: assets/branding/souqi_icon_monochrome.png

flutter_native_splash:
  color: "#FAF6EC"
  image: assets/branding/souqi_logo.png
  color_dark: "#FAF6EC"
  image_dark: assets/branding/souqi_logo.png
  android_12:
    color: "#FAF6EC"
    color_dark: "#FAF6EC"
    # Android 12+ clips the splash to a center circle; the padded icon
    # foreground fits it, the full logo would be cut off.
    image: assets/branding/souqi_icon_foreground.png
    image_dark: assets/branding/souqi_icon_foreground.png
  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
